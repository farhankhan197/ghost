name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: msys2 {0}
        run: |
          cd build
          ninja ghost ghost-checkpoint ghost-tests
      - name: Test
        shell: msys2 {0}
        run: |
          cd build
          ctest --output-on-failure

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build git
      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cd build
          ninja ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  test-macos-x86:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cd build
          ninja ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  test-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cd build
          ninja ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest --output-on-failure
