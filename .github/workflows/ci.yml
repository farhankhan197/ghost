name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/vcpkg-action@v2
      - name: Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --target ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest -C Release --output-on-failure

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/vcpkg-action@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build git
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --target ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  test-macos-x86:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/vcpkg-action@v2
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --target ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  test-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/vcpkg-action@v2
      - name: Install dependencies
        run: brew install cmake ninja
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --target ghost ghost-checkpoint ghost-tests
      - name: Test
        run: |
          cd build
          ctest --output-on-failure
