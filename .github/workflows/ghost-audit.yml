name: Ghost Audit

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build git

      - name: Build ghost
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static"
          ninja ghost

      - name: Run ghost audit
        id: audit
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Auditing commits: ${BASE_SHA}..${HEAD_SHA}"
          
          # Run audit and capture JSON
          ./build/ghost audit --range "${BASE_SHA}..${HEAD_SHA}" --json > audit.json || true
          
          # Also run without JSON to check exit code (blocked = non-zero)
          ./build/ghost audit --range "${BASE_SHA}..${HEAD_SHA}" > /dev/null 2>&1
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
          
          cat audit.json
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Format PR comment
        id: format
        run: |
          cat > format_comment.js << 'EOF'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          
          let md = '## 👻 Ghost Audit Report\n\n';
          
          // Status badge
          if (audit.blocked) {
            md += '**Status:** ❌ BLOCKED\\n\n';
          } else if (!audit.passed) {
            md += '**Status:** ⚠️ WARNING\\n\n';
          } else {
            md += '**Status:** ✅ PASSED\\n\n';
          }
          
          // Summary
          const pct = audit.total_lines > 0 ? Math.round((audit.ai_lines / audit.total_lines) * 100) : 0;
          md += `**AI Density:** ${pct}% (${audit.ai_lines} / ${audit.total_lines} lines)\\n\n`;
          
          if (audit.message) {
            md += `> ${audit.message}\\n\n`;
          }
          
          // Commits table
          if (audit.commits && audit.commits.length > 0) {
            md += '### Commits\\n\n';
            md += '| SHA | Author | AI% | Ghost Note | Verified |\\n';
            md += '|-----|--------|-----|------------|----------|\\n';
            
            for (const c of audit.commits) {
              const cpct = c.total_lines > 0 ? Math.round((c.ai_lines / c.total_lines) * 100) : 0;
              const ghost = c.has_ghost_note ? '✅' : '❌';
              const verified = c.has_verified_note ? '✅' : '❌';
              const sha = c.sha.substring(0, 8);
              md += `| \`${sha}\` | ${c.author.split('<')[0].trim()} | ${cpct}% | ${ghost} | ${verified} |\\n`;
            }
            md += '\n';
          }
          
          // Policy message
          if (audit.blocked) {
            md += '---\\n\\n';
            md += '**This PR is blocked.** Install ghost and commit with attribution tracking, or update ghost.yml policy.\\n';
          }
          
          fs.writeFileSync('pr_comment.md', md);
          console.log('Formatted PR comment');
          EOF
          
          node format_comment.js
        working-directory: ${{ github.workspace }}

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            
            // Find existing ghost audit comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existing = comments.find(c => c.body.includes('Ghost Audit Report'));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
        working-directory: ${{ github.workspace }}

      - name: Fail if blocked
        if: steps.audit.outputs.blocked == 'true'
        run: |
          echo "Ghost audit blocked this PR."
          exit 1
