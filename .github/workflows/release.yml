name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_COMMIT: b472291f295551b7127359ea38fdd2ca092f6f1b
      VCPKG_TRIPLET: x64-mingw-static
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-git
      - name: Setup vcpkg
        shell: msys2 {0}
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          git checkout "$VCPKG_COMMIT"
          cd ..
          ./vcpkg/bootstrap-vcpkg.sh
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
            vcpkg/buildtrees
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-
      - name: Build
        shell: msys2 {0}
        run: |
          ./vcpkg/vcpkg install --triplet "$VCPKG_TRIPLET"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_TOOLCHAIN_FILE=$(pwd)/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
          cmake --build build --target ghost ghost-checkpoint
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-windows-x86_64
          path: |
            build/ghost.exe
            build/ghost-checkpoint.exe

  build-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_COMMIT: b472291f295551b7127359ea38fdd2ca092f6f1b
      VCPKG_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          git checkout "$VCPKG_COMMIT"
          cd ..
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
            vcpkg/buildtrees
          key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-
      - name: Build
        run: |
          ./vcpkg/vcpkg install --triplet "$VCPKG_TRIPLET"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static" -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --target ghost ghost-checkpoint
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-linux-x86_64
          path: |
            build/ghost
            build/ghost-checkpoint

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release
          for dir in artifacts/*; do
            name=$(basename "$dir")
            platform=${name#ghost-}
            cd "$dir"
            if [[ "$name" == *"windows"* ]]; then
              mv ghost.exe "ghost-${platform}.exe" 2>/dev/null || true
              mv ghost-checkpoint.exe "ghost-checkpoint-${platform}.exe" 2>/dev/null || true
              cp "ghost-${platform}.exe" ../../release/ 2>/dev/null || true
              cp "ghost-checkpoint-${platform}.exe" ../../release/ 2>/dev/null || true
            else
              mv ghost "ghost-${platform}" 2>/dev/null || true
              mv ghost-checkpoint "ghost-checkpoint-${platform}" 2>/dev/null || true
              cp "ghost-${platform}" ../../release/ 2>/dev/null || true
              cp "ghost-checkpoint-${platform}" ../../release/ 2>/dev/null || true
            fi
            cd - > /dev/null
          done
          cd release
          sha256sum * > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        run: npm publish --provenance --access public
